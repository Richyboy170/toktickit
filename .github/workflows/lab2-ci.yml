name: Lab 2 CI

on:
  pull_request:
    branches: [lab2-staging, main]
  push:
    branches: [lab2-staging, main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toktickit -d toktickit_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://toktickit:toktickit@127.0.0.1:5432/toktickit_test?schema=public
      TEST_DATABASE_URL: postgresql://toktickit:toktickit@127.0.0.1:5432/toktickit_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npm run prisma:seed
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm audit
        working-directory: server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm audit
        working-directory: client

  e2e:
    runs-on: ubuntu-latest
    needs: [server, client]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toktickit -d toktickit_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://toktickit:toktickit@127.0.0.1:5432/toktickit_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab2-playwright-evidence
          path: |
            artifacts/lab-02/screenshots
            playwright-report
            test-results
